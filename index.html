<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sayang</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(to bottom, #ff9a9e, #fad0c4);
            font-family: 'Arial', sans-serif;
            color: #fff;
            text-align: center;
        }
        .container { background: rgba(255, 255, 255, 0.3); padding: 30px; border-radius: 20px; backdrop-filter: blur(10px); }
        img { width: 200px; height: 200px; border-radius: 50%; border: 5px solid white; margin-bottom: 20px; }
        h1 { margin: 10px 0; font-size: 2rem; }
        button {
            padding: 15px 30px; font-size: 1.2rem; border: none; border-radius: 50px;
            background: #ff4757; color: white; cursor: pointer; transition: 0.3s;
        }
        button:hover { transform: scale(1.1); background: #ff6b81; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ganti URL gambar di bawah dengan foto pacar kamu -->
        <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?q=80&w=300" alt="Pacar">
        
        <h1>Happy Birthday Sayang! ❤️</h1>
        <p>Semoga harimu penuh cinta dan kebahagiaan.</p>
        
        <!-- Musik -->
        <audio id="myAudio" loop>
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        </audio>

        <button onclick="playMusic()">Klik untuk Kejutan! 🎵</button>
    </div>

    <script>
        function playMusic() {
            var audio = document.getElementById("myAudio");
            audio.play();
            // Setelah tombol ditekan, tombol akan menghilang agar estetik
            document.querySelector("button").style.display = "none";
        }
    </script>
</body>
</html>
