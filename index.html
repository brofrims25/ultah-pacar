<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surat Spesial untuk Salsa ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');
        
        body { 
            margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background-image: url('background.png'); background-size: cover; background-position: center; 
            font-family: 'Dancing Script', cursive; overflow: hidden;
        }
        
        #letter-container { 
            display: none; position: relative; width: 320px; height: 450px;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        #paper { width: 100%; height: 100%; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.3)); }
        
        #text { 
            position: absolute; top: 70px; left: 30px; right: 30px; 
            font-size: 22px; color: #4a4a4a; text-align: center;
            transition: opacity 0.4s ease;
        }
        
        .controls { margin-top: 25px; display: flex; gap: 20px; }
        button { padding: 12px 25px; cursor: pointer; border-radius: 20px; border: none; background: #ff4757; color: white; transition: 0.3s; font-family: sans-serif;}
        button:hover { transform: scale(1.1); background: #ff6b81; }
        #openBtn { font-size: 18px; padding: 20px 40px; background: #e11d48; }
    </style>
</head>
<body>

    <audio id="myAudio" loop><source src="musik.mp3" type="audio/mpeg"></audio>

    <button id="openBtn" onclick="startExperience()">Klik untuk Membuka Surat ❤️</button>

    <div id="letter-container">
        <img id="paper" src="paper.png" alt="Paper">
        <div id="text">...</div>
    </div>

    <div class="controls" id="navControls" style="display:none;">
        <button onclick="changePage(-1)">⬅️ Mundur</button>
        <button onclick="changePage(1)">Maju ➡️</button>
    </div>

    <script>
        const pages = [
            "Cayankk akuhhh yang canttikk, selamt ulang tahun yahhh. Tambah tua aja, hati-hati lo nanti dipanggil tante cantik heheh.",
            "Cayankk, aku mau bilang jaga kesehatan ya. Jujur gk nyangka udah sepanjang ini, aku harap hubungan ini akan kekal di alam mana pun.",
            "Aku harap kita bisa cepat bertemu. Aku tahu sukses di bawah 20 tahun itu susah, tapi aku janji akan bertemu dengan Salsa yang cantik dan imut ini.",
            "Sekali lagi selamat ultah cayankkuu. Maaf ya selama ini aku suka bikin kamu marah, bete, dan khawatir. Maaf yaa.",
            "Aku pun sebenernya bingung kenapa setiap saat ada aja yang perlu bantuan aku. Itu aja sih, soalnya pesan ku untuk cayankk terlalu banyak, tapi gk sebanyak cintaku untukmu.",
            "Love youuu cayankk akuhhhh. Panjang umur ya, sehat-sehat ya, sampai bertemu secara langsung di masa depan. Salam dari Aidil untuk Salsa, bunga yang paling aku cintai."
        ];
        
        let currentPage = 0;

        function startExperience() {
            document.getElementById('myAudio').play();
            document.getElementById('openBtn').style.display = 'none';
            document.getElementById('letter-container').style.display = 'block';
            document.getElementById('navControls').style.display = 'flex';
            document.getElementById('text').innerText = pages[0];
        }

        function changePage(dir) {
            const textElement = document.getElementById('text');
            textElement.style.opacity = 0; 
            
            setTimeout(() => {
                currentPage += dir;
                if (currentPage < 0) currentPage = 0;
                if (currentPage >= pages.length) currentPage = pages.length - 1;
                
                textElement.innerText = pages[currentPage];
                textElement.style.opacity = 1;
            }, 400);
        }
    </script>
</body>
</html>
