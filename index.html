<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surat Spesial untuk Salsa ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');
        
        body { 
            margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: url('background.png') center/cover no-repeat; font-family: 'Dancing Script', cursive; overflow: hidden;
        }

        /* Hujan Emoji */
        .emoji-rain { position: absolute; top: -10%; font-size: 20px; animation: rain linear infinite; pointer-events: none; }
        @keyframes rain { to { transform: translateY(110vh) rotate(360deg); } }

        /* Tombol Surat (Responsif) */
        #suratBtn { width: 120px; max-width: 40vw; cursor: pointer; transition: 0.3s; z-index: 10; }
        #suratBtn:hover { transform: scale(1.1) rotate(5deg); }

        /* Kertas Surat (Responsif) */
        #letter-container { 
            display: none; position: relative; 
            width: 90%; max-width: 350px; /* Lebar maksimal agar tidak terlalu lebar di PC */
            height: 70vh; max-height: 500px;
            background: rgba(255,255,255,0.9); padding: 20px; border-radius: 15px;
            border: 2px solid #ffccd5; box-shadow: 0 0 20px rgba(255, 105, 180, 0.3);
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        #paper { width: 100%; height: 100%; object-fit: contain; }
        #text { 
            position: absolute; top: 15%; left: 10%; right: 10%; 
            font-size: clamp(16px, 5vw, 22px); /* Font otomatis menyesuaikan layar */
            color: #d63384; text-align: center;
        }
        
        .controls { margin-top: 20px; display: flex; gap: 15px; z-index: 10; }
        button { 
            padding: 12px 20px; cursor: pointer; border-radius: 20px; border: none; 
            background: #ff4757; color: white; font-family: sans-serif; font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop><source src="musik.mp3" type="audio/mpeg"></audio>
    <audio id="clickSound"><source src="tombol.mp3" type="audio/mpeg"></audio>

    <script>
        const emojis = ['🎂', '❤️', '🌸', '🎁', '💖'];
        for(let i=0; i<20; i++) {
            let div = document.createElement('div');
            div.className = 'emoji-rain';
            div.innerText = emojis[Math.floor(Math.random()*emojis.length)];
            div.style.left = Math.random()*100 + 'vw';
            div.style.animationDuration = (Math.random()*3+3) + 's';
            div.style.animationDelay = Math.random()*5 + 's';
            document.body.appendChild(div);
        }
    </script>

    <img id="suratBtn" src="surat.png" onclick="start()" alt="Buka Surat">

    <div id="letter-container">
        <img id="paper" src="paper.png">
        <div id="text">...</div>
    </div>

    <div class="controls" id="navControls" style="display:none;">
        <button onclick="playClick(); changePage(-1)">⬅️ Mundur</button>
        <button onclick="playClick(); changePage(1)">Maju ➡️</button>
    </div>

    <script>
        const pages = [
            "Cayankk akuhhh yang canttikk, selamt ulang tahun yahhh. Tambah tua aja, hati-hati lo nanti dipanggil tante cantik heheh.",
            "Cayankk, aku mau bilang jaga kesehatan ya. Jujur gk nyangka udah sepanjang ini, aku harap hubungan ini akan kekal di alam mana pun.",
            "Aku harap kita bisa cepat bertemu. Aku tahu sukses di bawah 20 tahun itu susah, tapi aku janji akan bertemu dengan Salsa yang cantik dan imut ini.",
            "Sekali lagi selamat ultah cayankkuu. Maaf ya selama ini aku suka bikin kamu marah, bete, dan khawatir. Maaf yaa.",
            "Aku pun sebenernya bingung kenapa setiap saat ada aja yang perlu bantuan aku. Itu aja sih, soalnya pesan ku untuk cayankk terlalu banyak, tapi gk sebanyak cintaku untukmu.",
            "Love youuu cayankk akuhhhh. Panjang umur ya, sehat-sehat ya, sampai bertemu secara langsung di masa depan. Salam dari Aidil untuk Salsa, bunga yang paling aku cintai."
        ];
        let currentPage = 0;
        function playClick() { document.getElementById('clickSound').play(); }
        function start() {
            playClick(); document.getElementById('bgMusic').play();
            document.getElementById('suratBtn').style.display = 'none';
            document.getElementById('letter-container').style.display = 'block';
            document.getElementById('navControls').style.display = 'flex';
            document.getElementById('text').innerText = pages[0];
        }
        function changePage(dir) {
            currentPage = Math.max(0, Math.min(pages.length - 1, currentPage + dir));
            document.getElementById('text').innerText = pages[currentPage];
        }
    </script>
</body>
</html>
